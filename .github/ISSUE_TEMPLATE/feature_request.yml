name: Feature request / Solicitud de funcionalidad
description: Suggest a new feature or enhancement for Oh My Rigel (English or Spanish) / Sugiere una funcionalidad nueva o una mejora para Oh My Rigel (inglés o español)
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Write in English or Spanish. / Escribe en inglés o español.**

        Oh My Rigel is a community fork of Oh My OpenAgent that runs on OpenCode V2. Read the [contributing guide](https://github.com/GaboEI/oh-my-rigel/blob/v2-mirror/CONTRIBUTING.md) for conduct, contribution, and QA expectations before submitting.

        Oh My Rigel es un fork comunitario de Oh My OpenAgent que corre sobre OpenCode V2. Lee la [guía de contribución](https://github.com/GaboEI/oh-my-rigel/blob/v2-mirror/CONTRIBUTING.md) para conocer la conducta, la contribución y las expectativas de QA antes de enviar.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites / Requisitos previos
      description: Please confirm the following before submitting / Confirma lo siguiente antes de enviar
      options:
        - label: I read the contributing guide and will keep this request respectful and on topic / Leí la guía de contribución y mantendré esta solicitud respetuosa y enfocada
          required: true
        - label: I searched existing issues to avoid duplicates / Busqué en los issues existentes para evitar duplicados
          required: true
        - label: This request is specific to Oh My Rigel, not to OpenCode core nor to the upstream OmO parent product / Esta solicitud es específica de Oh My Rigel, no del núcleo de OpenCode ni del producto padre OmO
          required: true
        - label: I can describe a concrete use case and how the result could be verified / Puedo describir un caso de uso concreto y cómo podría verificarse el resultado
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description / Descripción del problema
      description: What problem does this feature solve, and what is your use case? / ¿Qué problema resuelve esta funcionalidad y cuál es tu caso de uso?
      placeholder: |
        Describe the problem or limitation you are experiencing... / Describe el problema o la limitación que experimentas...
        Example: "As a user, I find it difficult to..." / Ejemplo: "Como usuario, me resulta difícil..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / Solución propuesta
      description: Describe how you would like this to work / Describe cómo te gustaría que funcionara
      placeholder: |
        Describe your proposed solution in detail... / Describe tu solución propuesta en detalle...
        Example: "Add a new hook that..." / Ejemplo: "Agrega un nuevo hook que..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / Alternativas consideradas
      description: Have you considered any alternative solutions or workarounds? / ¿Consideraste alguna solución alternativa o forma de evitarlo?
      placeholder: |
        Describe any alternative solutions you have considered... / Describe las soluciones alternativas que consideraste...
        Example: "I tried using X but it did not work because..." / Ejemplo: "Probé usar X pero no funcionó porque..."

  - type: textarea
    id: environment
    attributes:
      label: Environment (optional) / Entorno (opcional)
      description: If relevant, share the host and revision you are working from / Si es relevante, comparte el host y la revisión desde la que trabajas
      placeholder: |
        OpenCode version: run `opencode --version` / versión de OpenCode: ejecuta `opencode --version`
        Rigel revision: run `git rev-parse --short HEAD` in your checkout / revisión de Rigel: ejecuta `git rev-parse --short HEAD` en tu checkout
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context / Contexto adicional
      description: Any other context, mockups, or examples / Cualquier otro contexto, maqueta o ejemplo
      placeholder: |
        Add any other context, screenshots, code examples, or links... / Agrega cualquier otro contexto, captura, ejemplo de código o enlace...
        Examples from other tools or projects are helpful. / Los ejemplos de otras herramientas o proyectos ayudan.

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature type / Tipo de funcionalidad
      description: What type of feature is this? / ¿Qué tipo de funcionalidad es?
      options:
        - New agent / Nuevo agente
        - New hook / Nuevo hook
        - New tool / Nueva herramienta
        - New MCP integration / Nueva integración MCP
        - Configuration option / Opción de configuración
        - Documentation / Documentación
        - Other / Otro
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution / Contribución
      description: Are you willing to contribute to this feature? / ¿Estás dispuesto a contribuir a esta funcionalidad?
      options:
        - label: I am willing to submit a pull request for this feature / Estoy dispuesto a enviar un pull request para esta funcionalidad
        - label: I can help with testing / Puedo ayudar con las pruebas
        - label: I can help with documentation / Puedo ayudar con la documentación
